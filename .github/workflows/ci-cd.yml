name: CI/CD

on:
  push:
    branches: [main]

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
             
            - uses: oven-sh/setup-bun@v2

            - name: Install packages
              run : bun install --frozen-lockerfile

            - name: build the project
              run: bun run build
              env:
                DATABASE_URL: postgresql://user:password@localhost:5432/db

    package:
        needs: verify
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push the image
              uses: docker/build-push-action@v6
              with:
               context: .
               push: true
               tags: |
                 ${{ secrets.DOCKERHUB_USERNAME }}/yojana-mitra:latest
                 ${{ secrets.DOCKERHUB_USERNAME }}/yojana-mitra:${{ github.sha }}

    migrate:
        needs: package
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2

            - name: Install packages
              run: bun install --frozen-lockfile

            - name: Update database tables
              run: bunx prisma migrate deploy
              env:
                DATABASE_URL: ${{ secrets.DATABASE_URL }}     
                
    deploy:
       needs: [package, migrate]
       runs-on: ubuntu-latest
       steps:
         - name: Deploy to the server
           run: |
             mkdir -p ~/.ssh
             echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key
             chmod 600 ~/.ssh/key
             ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "cd ~/yojana-mitra && docker compose pull && docker compose up -d && docker image prune -f"                
