
<svg xmlns="http://www.w3.org/2000/svg" viewBox="236 21 328 328" fill="none">
  <title>Yojana Mitra — Your trusted companion for government schemes</title>
  <desc>An independent civic technology logo representing people, community, and support.</desc>

  <defs>
    <style>
      .navy { fill: #123B70; }
      .orange { fill: #FF8C00; }
      .green { fill: #138808; }
      .brand {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .hindi {
        font-family: "Noto Sans Devanagari", "Mangal", sans-serif;
      }
      .tagline {
        font-family: Arial, Helvetica, sans-serif;
