    <circle cx="374" cy="91" r="7"/>
    <circle cx="426" cy="91" r="7"/>
    <circle cx="360" cy="116" r="7"/>
    <circle cx="440" cy="116" r="7"/>
    <circle cx="383" cy="119" r="7"/>
    <circle cx="417" cy="119" r="7"/>
    <circle cx="377" cy="137" r="7"/>
    <circle cx="423" cy="137" r="7"/>
    <circle cx="400" cy="111" r="7"/>
    <circle cx="400" cy="147" r="7"/>
