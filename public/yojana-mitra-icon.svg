  <path d="M419 70
           C449 73 477 86 498 113
           C533 158 533 224 494 259"
        stroke="#138808" stroke-width="10"
        stroke-linecap="round"/>

  <!-- Abstract connected-community network -->
  <g stroke="#123B70" stroke-width="4" stroke-linecap="round" opacity="0.95">
    <path d="M400 76 L374 91 L360 116 L377 137 L400 147
